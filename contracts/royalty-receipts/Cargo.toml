[package]
name = "footnote-royalty-receipts"
version = "0.1.0"
edition = "2021"
description = "Append-only on-chain log of Footnote royalty payouts (NEAR Hackathon)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
